name: Portfolio content checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test localization and profile content
        run: node --test tests/*.test.mjs
